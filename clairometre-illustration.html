<style>
html,body{margin:0;padding:0;background:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;color:#334155}
.duo{margin:0;padding:24px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pile{position:relative;width:410px;height:672px}
.face{position:absolute;padding:0;border:0;background:none;cursor:pointer;border-radius:8px;transition:left .45s ease,top .45s ease,transform .45s ease,box-shadow .3s ease}
.face:focus-visible{outline:3px solid #344C94;outline-offset:4px}
.face img{display:block;width:240px;height:630px;object-fit:cover;border-radius:8px;border:1px solid #E5E7EB;background:#FFFFFF}
.avant{left:8px;top:0;z-index:2;transform:rotate(-4deg);box-shadow:0 3px 8px rgba(26,35,64,.14),0 26px 52px rgba(26,35,64,.30);cursor:default}
.arriere{left:160px;top:26px;z-index:1;transform:rotate(6deg);box-shadow:0 2px 6px rgba(26,35,64,.10),0 18px 36px rgba(26,35,64,.18)}
.avant:hover{transform:rotate(-4deg) scale(1.04);box-shadow:0 6px 14px rgba(26,35,64,.18),0 34px 64px rgba(26,35,64,.38)}
.arriere:hover,.arriere:focus-visible{transform:rotate(6deg) scale(1.04);box-shadow:0 6px 14px rgba(26,35,64,.16),0 30px 56px rgba(26,35,64,.32)}
figcaption{margin:0;text-align:center;font-size:15px;line-height:1.5;color:#334155}
.indice{display:none;position:absolute;right:14px;top:44%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#1A2340;border:2px solid #FFFFFF;box-shadow:0 4px 10px rgba(26,35,64,.30);align-items:center;justify-content:center;pointer-events:none;transform:rotate(-6deg)}
.arriere .indice{display:flex}
@media (max-width:580px){
  .duo{padding:20px 12px 12px}
  .pile{width:290px;height:480px}
  .face img{width:170px;height:446px}
  .arriere{left:112px;top:20px}
  .indice{width:38px;height:38px;margin-top:-19px;right:10px}
}
@media (prefers-reduced-motion: reduce){.face{transition:none}}
</style>
